/* The office is the stage; controls and workspace details hover over it. */
.app{grid-template-columns:80px minmax(0,1fr);min-height:500px}
.main{overflow:hidden;padding-bottom:24px;gap:20px}
.office-shell{--panel-reserve:338px;display:block;isolation:isolate;background:#b4b99e;border:5px solid #fff;min-height:0}
.office-shell.panels-hidden{--panel-reserve:0px}
.scene-wrap{position:absolute;left:calc((100% - var(--panel-reserve))/2);top:50%;transform:translate(-50%,-50%);max-height:none;max-width:none;transition:left .2s ease}
.location-tag{top:15px;left:15px}
.controls-wrap{position:absolute;z-index:12;bottom:20px;left:calc((100% - var(--panel-reserve))/2);transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);pointer-events:none;transition:left .2s ease}
.dock{pointer-events:auto;background:#fffefaf2;backdrop-filter:blur(18px);border:1px solid #ffffffa8;box-shadow:0 10px 35px #26352c2e,0 2px 8px #33413414;border-radius:18px;padding:9px}
.dock-button{min-width:105px}.leave{min-width:0}
.map-legend{position:absolute;z-index:2;top:16px;left:16px;width:max-content;max-width:calc(100% - 48px);padding:9px 12px;border:1px solid #ffffff80;border-radius:9px;background:#fffefad9;backdrop-filter:blur(12px);color:#798171;box-shadow:0 3px 10px #26352c10;font-size:10px;pointer-events:none}
.map-legend{display:none}.map-legend>span:last-child{display:none}.walk-hint{bottom:16px;background:#fffefad4}
.side{position:absolute;z-index:6;top:17px;right:17px;bottom:108px;width:300px;max-height:none;min-height:0;border:1px solid #ffffffbc;background:#fffefaf5;backdrop-filter:blur(18px);border-radius:17px;box-shadow:0 12px 40px #283a2929,0 2px 9px #273a2610;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#deddd2 transparent}
.side-top{padding:24px 35px 21px 23px}.side-body{padding:21px 23px}.side-footer{padding:0 23px 22px}
.panels-hidden .side{visibility:hidden;pointer-events:none}
.panel-toggle{position:absolute;z-index:8;right:29px;top:29px;display:grid;place-items:center;width:27px;height:27px;border:1px solid #e5e3df;border-radius:8px;color:#92958f;background:#fffdf8;font-size:19px;box-shadow:0 2px 8px #29362908}
.panel-toggle:hover{color:var(--blue);background:#f1f4ff}.panel-toggle-open{display:none}
.panels-hidden .panel-toggle{top:16px;right:16px;width:auto;height:35px;padding:0 11px;border-color:#ffffffa0;box-shadow:0 4px 15px #29362915;background:#fffefae8;font-size:11px;color:#737b70;backdrop-filter:blur(12px)}
.panels-hidden .panel-toggle-close{display:none}.panels-hidden .panel-toggle-open{display:flex;align-items:center;gap:7px}.panel-toggle-open .icon{width:16px;height:16px}
.status-menu{box-shadow:0 10px 35px #22322c26}.toast{bottom:104px}

/* A compact overview leaves the complete office visible in a short preview. */
:root{--ui-scale:.55}
html,body{width:100%;height:100%;overflow:hidden}
.app{width:calc(100% / var(--ui-scale));height:calc(100dvh / var(--ui-scale));min-height:0;transform:scale(var(--ui-scale));transform-origin:top left}
#view-scale{font-variant-numeric:tabular-nums;white-space:nowrap;min-width:78px;justify-content:center}
@media(max-width:700px){:root{--ui-scale:.85}.app{height:calc(100dvh / var(--ui-scale))}}


/* Quiet, asynchronous notes, left at a teammate's desk. */
.desk-tabs{display:flex;gap:5px;padding:5px;border-radius:10px;background:#eeede6;margin:0 0 18px}
.desk-tabs button{flex:1;padding:8px 5px;border-radius:7px;font-size:10px;color:#969185}
.desk-tabs button.active{background:#fffefa;color:#5f6554;box-shadow:0 2px 6px #645e3c10}
.desk-tabs small{font-size:9px;color:#a79c80;margin-left:4px}
.sticky-note{position:relative;background:#fff2bc;border:1px solid #ecdda3;border-radius:3px 3px 13px 3px;padding:16px 15px 14px;margin:14px 0;box-shadow:0 4px 10px #6b633a0d;overflow:hidden}
.sticky-note:after{content:'';position:absolute;bottom:0;right:0;width:13px;height:13px;background:linear-gradient(135deg,#e9d79b 50%,#fffefa 51%);border-top-left-radius:3px}
.sticky-note.read{background:#f4f0de;border-color:#e8e1c7}
.sticky-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;color:#998257;margin-bottom:10px}
.sticky-meta strong{font-weight:600;color:#7d6946}.sticky-meta time{font-size:8px;white-space:nowrap}
.side p.sticky-message{white-space:pre-wrap;overflow-wrap:anywhere;color:#665c43;line-height:1.8;font-size:12px}
.sticky-actions{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:14px;font-size:9px;color:#a28d60}
.sticky-actions button{font-size:9px;color:#86703c;background:#fff9df;border:1px solid #e5d49b;padding:5px 8px;border-radius:5px}
.desk-empty{padding:24px 10px;text-align:center;border:1px dashed #ded8c0;border-radius:12px;color:#c2aa63;margin-top:18px}
.desk-empty p{margin-top:10px}.desk-note-button .dock-icon{background:#fff4d7;color:#b19851}
.modal select,.modal textarea{display:block;width:100%;font:inherit;font-size:12px;line-height:1.7;color:var(--ink);border:1px solid #e0dfdf;border-radius:8px;padding:11px;background:#fff;margin-top:8px}
.modal textarea{resize:vertical;min-height:125px;max-height:240px;background:#fff9e6;border-color:#ebdfb7}
.modal textarea:focus-visible{outline:3px solid #ddc989;outline-offset:3px}
