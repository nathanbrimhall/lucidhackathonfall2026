name: Server foundation
on:
  push:
  pull_request:

jobs:
  native-runtime:
    name: Native SQLite and RTC (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target worker-runtime -t lucid-office:native-check .
      - name: Verify production migrations and native modules as runtime user
        run: |
          docker run --rm --entrypoint node lucid-office:native-check --input-type=module -e '
            import { openStorage } from "./dist/server/src/repositories/Storage.js";
            const storage = openStorage(":memory:");
            if (!storage.healthCheck()) throw new Error("Storage unavailable");
            storage.db.prepare("SELECT count(*) FROM notification_outbox").get();
            storage.close();
            const rtc = await import("@livekit/rtc-node");
            const room = new rtc.Room();
            await room.disconnect();
            await rtc.dispose();'
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Every docker compose step uses the loopback LiveKit overlay.
      COMPOSE_FILE: compose.yaml:deploy/compose.ci.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify build, full test suite and integrated browsers without provider access
        run: npm run office:verify
      - name: Verify offline AI regression fixtures (no provider credentials)
        run: npm run ai:eval
      - run: docker build --target worker-runtime -t lucid-ai-worker:ci .
      - name: Verify worker native RTC runtime
        run: docker run --rm --entrypoint node lucid-ai-worker:ci --input-type=module -e 'const rtc = await import("@livekit/rtc-node"); const room = new rtc.Room(); await room.disconnect(); await rtc.dispose();'
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: npm run smoke
      - name: Confirm offline reminder before container replacement
        run: npm run smoke:reminders -- seed "$RUNNER_TEMP/reminder-smoke.json"
      - name: Replace application while retaining its data volume
        run: docker compose up -d --force-recreate --no-deps --wait --wait-timeout 60 server
      - name: Verify durable reminder and browser deduplication
        run: npm run smoke:reminders -- verify "$RUNNER_TEMP/reminder-smoke.json"
      - if: always()
        run: rm -f "$RUNNER_TEMP/reminder-smoke.json"
      - run: npm run smoke:media
      - name: Start isolated LiveKit for synthetic AI media test
        run: |
          docker run -d --rm --name lucid-ai-smoke-ci \
            -p 17880:17880/tcp -p 17881:17881/tcp -p 17882:17882/udp \
            livekit/livekit-server:v1.13.10 --config-body '
          port: 17880
          rtc:
            tcp_port: 17881
            udp_port: 17882
            node_ip: 127.0.0.1
            use_external_ip: false
          keys:
            devkey: test-only-ai-smoke-secret-at-least-32-characters
          logging:
            level: warn'
      - run: npm run smoke:ai-media
        env:
          AI_SMOKE_LIVEKIT_URL: ws://127.0.0.1:17880
          AI_SMOKE_API_KEY: devkey
          AI_SMOKE_API_SECRET: test-only-ai-smoke-secret-at-least-32-characters
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
      - if: always()
        run: docker rm -f lucid-ai-smoke-ci || true
