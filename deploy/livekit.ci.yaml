port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  # CI browsers run on the same host as the published ports, and the runner's
  # public IP is not reachable from itself, so advertise loopback only.
  node_ip: 127.0.0.1
  use_external_ip: false
logging:
  level: info
webhook:
  # Signing key is supplied by LIVEKIT_WEBHOOK_API_KEY in Compose.
  # Keep in sync with deploy/livekit.yaml.
  urls:
    - http://server:2567/api/livekit/webhook
