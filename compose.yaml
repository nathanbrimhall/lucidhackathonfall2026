name: lucidhackathonfall2026

services:
  data-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data /usage && chown -R 1000:1000 /data /usage"]
    volumes:
      - office-data:/data
      - office-ai-usage:/usage
    restart: "no"

  migrate:
    build:
      context: .
      target: server-runtime
    env_file: .env
    environment:
      DATABASE_URL: /data/office.sqlite
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    command: ["node", "dist/server/src/migrate.js"]
    user: "1000:1000"
    volumes:
      - office-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: "no"

  server:
    build:
      context: .
      target: server-runtime
    env_file: .env
    environment:
      DATABASE_URL: /data/office.sqlite
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    init: true
    ports:
      - "${PORT:-2567}:${PORT:-2567}"
    volumes:
      - office-data:/data
    depends_on:
      data-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    profiles: ["ai"]
    build:
      context: .
      target: worker-runtime
    environment:
      AI_SERVER_URL: http://server:${PORT:-2567}
      AI_WORKER_SECRET: "${AI_WORKER_SECRET:-}"
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      AI_USAGE_DATABASE: /usage/ai-usage.sqlite
      AI_LOCAL_DAILY_REQUEST_LIMIT: "${AI_LOCAL_DAILY_REQUEST_LIMIT:-20}"
      AI_GEMINI_OUTPUT_MODE: "${AI_GEMINI_OUTPUT_MODE:-json}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AI_PROVIDER_BASE_URL: "${AI_PROVIDER_BASE_URL:-}"
      AI_TRANSCRIPTION_MODEL: "${AI_TRANSCRIPTION_MODEL:-}"
      AI_SUMMARY_MODEL: "${AI_SUMMARY_MODEL:-}"
      AI_CHUNK_SECONDS: "${AI_CHUNK_SECONDS:-10}"
      AI_PROVIDER_TIMEOUT_MS: "${AI_PROVIDER_TIMEOUT_MS:-30000}"
      AI_MAX_TRANSCRIPT_CHARS: "${AI_MAX_TRANSCRIPT_CHARS:-100000}"
    volumes:
      - office-ai-usage:/usage
    init: true
    depends_on:
      server:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 15s

  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-change-me-at-least-32-characters}"
      LIVEKIT_WEBHOOK_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

volumes:
  office-data:
  office-ai-usage:
